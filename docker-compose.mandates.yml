services:
  mandates-pg:
    image: postgres:16
    environment:
      POSTGRES_USER: mandates
      POSTGRES_PASSWORD: mandates
      POSTGRES_DB: mandates
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandates -d mandates"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - mandates-pg-data:/var/lib/postgresql/data

volumes:
  mandates-pg-data:
