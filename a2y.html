<script>
/* =========================================================================
   Y2A  ·  identity (KYA) → authority (mandate) → payment (Yuno)
   LLM #1 compiles language into a DRAFT.  LLM #2 shops and may try anything.
   Between them and money sits a pure function. That is the whole product.
   ========================================================================= */
const encd=new TextEncoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=b=>b64(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const P={name:'ECDSA',namedCurve:'P-256'}, SP={name:'ECDSA',hash:'SHA-256'};
const genk=()=>crypto.subtle.generateKey(P,true,['sign','verify']);
const sign=async(k,s)=>b64(await crypto.subtle.sign(SP,k,encd.encode(s)));
const verify=async(k,g,s)=>{try{return await crypto.subtle.verify(SP,k,ub64(g),encd.encode(s));}catch(e){return false;}};
async function jkt(pub){const j=await crypto.subtle.exportKey('jwk',pub);
  return b64u(await crypto.subtle.digest('SHA-256',encd.encode(JSON.stringify({crv:j.crv,kty:j.kty,x:j.x,y:j.y}))));}
function canonical(o){if(o===null||typeof o!=='object')return JSON.stringify(o);
  if(Array.isArray(o))return '['+o.map(canonical).join(',')+']';
  return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canonical(o[k])).join(',')+'}';}
async function sha(s){return b64u(await crypto.subtle.digest('SHA-256',encd.encode(s))).slice(0,16);}

/* ---------- Yuno data → a PROPOSED mandate. numbers computed, never guessed ---------- */
function deriveProposal(){
  const mine=S.ledger.filter(r=>r.history);
  if(!mine.length)return null;
  const amounts=mine.map(r=>r.amount).sort((a,b)=>a-b);
  const highest=amounts[amounts.length-1];
  const ceiling=Math.ceil(highest/10)*10;                    /* round the highest ever paid up to the nearest 10 */
  const months=Math.round((Date.now()-Math.min(...mine.map(r=>r.ts)))/(30*864e5));
  const disputes=0;
  const spec={title:'Travel to Córdoba',category:'flight',origin:'Buenos Aires',destination:'Córdoba',
    max_total_amount:ceiling,currency:'USD',max_transactions:1,valid_until:'2026-08-31',
    outside_scope_action:'ASK_HUMAN',source:'proposed from your Yuno history'};
  const ev=[
    ['Category','flight',mine.length+' of your last '+mine.length+' agent purchases'],
    ['Route','BUE → COR','every flight you have booked'],
    ['Maximum',money(ceiling),'the most you ever paid is '+money(highest)],
    ['Purchases','1','you book one leg at a time'],
    ['Valid until','Aug 31','30 days, renewable'],
    ['Payment method','Visa ••4242','used in '+mine.length+' of '+mine.length]
  ];
  return {spec,ev,stats:{n:mine.length,months,highest,disputes,volume:mine.reduce((a,r)=>a+r.amount,0)}};
}

const PROMPT=t=>`Compile a spending instruction into a machine-readable IntentMandate. Return ONLY JSON with exactly:
{"title":string,"category":"flight"|"hotel"|"groceries"|"other","origin":string,"destination":string,"max_total_amount":number,"currency":"USD","max_transactions":number,"valid_until":"YYYY-MM-DD","outside_scope_action":"ASK_HUMAN"|"REJECT"}

Instruction: """${t}"""`;
function fb(t){const s=t.toLowerCase();
  const amt=(s.match(/(?:menos de|below|under|less than|max(?:imo)?|hasta|up to)\s*(?:usd\s*)?\$?\s*([\d,.]+)/)||s.match(/\$\s*([\d,.]+)/)||[,'150'])[1];
  const dest=(t.match(/a\s+(C[óo]rdoba|[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)/)||t.match(/to\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)/)||[,'Córdoba'])[1];
  const orig=(t.match(/de\s+(Buenos Aires|[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)/)||t.match(/from\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(?:\s[A-Z][\wáéíóúñ]+)?)/)||[,'Buenos Aires'])[1];
  const cat=/hotel|noche|night/.test(s)?'hotel':/super|grocer|comida/.test(s)?'groceries':'flight';
  const n=(s.match(/(\d+)\s*(?:veces|times|compras|purchases)/)||[,''])[1];
  return {title:'Travel to '+dest,category:cat,origin:orig,destination:dest,
    max_total_amount:Number(String(amt).replace(/[,.]/g,m=>m===','?'':'.'))||150,currency:'USD',
    max_transactions:n?Number(n):(/solo uno|una vez|\bonce\b|\bsingle\b/.test(s)?1:3),valid_until:'2026-08-31',
    outside_scope_action:/pregunt|ask me|approval/.test(s)?'ASK_HUMAN':'REJECT'};}
async function compile(text){
  S.compiling=true;render();let spec=null,by='rules';
  try{const sm=await claude.use('sample');
    if(sm){const r=await Promise.race([sm.json(PROMPT(text),{modelTier:'quick',cache:true}),new Promise((_,j)=>setTimeout(()=>j(0),9000))]);
      if(r&&typeof r==='object'){const f=fb(text);
        spec={title:r.title||f.title,category:['flight','hotel','groceries','other'].includes(r.category)?r.category:f.category,
          origin:r.origin||f.origin,destination:r.destination||f.destination,
          max_total_amount:Number(r.max_total_amount)>0?Number(r.max_total_amount):f.max_total_amount,currency:'USD',
          max_transactions:Number(r.max_transactions)>0?Math.floor(Number(r.max_transactions)):f.max_transactions,
          valid_until:/^\d{4}-\d{2}-\d{2}$/.test(r.valid_until)?r.valid_until:f.valid_until,
          outside_scope_action:r.outside_scope_action==='REJECT'?'REJECT':'ASK_HUMAN'};by='claude';}}
  }catch(e){}
  if(!spec)spec=fb(text);
  spec.source=text;S.draft=spec;S.compiling=false;S.compiledBy=by;log('mandate.drafted',{by,status:'DRAFT'});render();
}

async function makeCheckout(offer){
  const body={merchant_id:offer.mid,product:{type:'flight',flight:offer.flight,origin:'BUE',destination:offer.dest||'COR'},
    total:{amount:offer.price,currency:'USD'}};

/* ---------- cart mandate: the agent signs THIS checkout, nothing else ---------- */
async function makeCart(checkout,keyName){
  const k=S.keys[keyName||'agent'];
  const body={intent_mandate_id:'IM_001',checkout_id:checkout.checkout_id,checkout_hash:checkout.hash,
    requested_amount:checkout.total.amount,jkt:k.jkt,nonce:b64(crypto.getRandomValues(new Uint8Array(9)))};

/* ---------- verification (crypto) ---------- */
async function verifyIdentity(m,cart,checkout,opts){
  const o=[];
  const presented=opts.tamper?Object.assign({},m.claims,opts.tamper):m.claims;
  const who=opts.impersonate?S.attacker:S.agent;
  /* IDENTITY — who is speaking, and can they prove it */
  o.push({g:'IDENTITY',name:'Principal Didit verified',detail:S.principal.id+' · IAL2',ok:S.principal.kyc==='VERIFIED',code:'SIGNATURE_INVALID'});
  o.push({g:'IDENTITY',name:'KYA credential active',detail:(opts.impersonate?'kya_5512':S.agent.credential.id)+' · '+who.credential.status,
    ok:who.credential.status==='active',code:'CREDENTIAL_SUSPENDED'});
  o.push({g:'IDENTITY',name:'Agent ERC-8004 valid',detail:'#'+who.agentId+' · eip155:84532',ok:!!who.agentId,code:'AGENT_NOT_BOUND'});
  const proofOk=await verify(cart.pub,cart.proof,canonical({intent_mandate_id:cart.intent_mandate_id,
    checkout_id:cart.checkout_id,checkout_hash:cart.checkout_hash,requested_amount:cart.requested_amount,jkt:cart.jkt,nonce:cart.nonce}));
  o.push({g:'IDENTITY',name:'Proof of possession',detail:'ES256 · cnf.jkt '+cart.jkt.slice(0,10)+'…',ok:proofOk,code:'SIGNATURE_INVALID'});
  /* DELEGATION — is this agent the one the human authorized */
  const sigOk=await verify(S.keys.principal.kp.publicKey,m.sig,canonical(presented));
  o.push({g:'DELEGATION',name:'Intent Mandate signature',detail:'signed by '+S.principal.id,ok:sigOk,code:'SIGNATURE_INVALID'});
  const bound=presented.cnf.jkt===cart.jkt;
  o.push({g:'DELEGATION',name:'Agent matches mandate',detail:bound?'#'+S.agent.agentId+' = #'+S.agent.agentId
    :'mandate expects #'+S.agent.agentId+' · request from #'+who.agentId,ok:bound,code:'AGENT_NOT_BOUND'});
  return {checks:o,ok:o.every(c=>c.ok),claims:presented};
}
async function verifyIntegrity(cart,checkout){
  const o=[];
  const rehash=await sha(canonical({merchant_id:checkout.merchant_id,product:checkout.product,total:checkout.total}));
  o.push({g:'INTEGRITY',name:'Checkout hash valid',detail:rehash===cart.checkout_hash?rehash
    :'signed '+cart.checkout_hash+' ≠ presented '+rehash,ok:rehash===cart.checkout_hash,code:'CART_INTEGRITY'});
  const linked=cart.checkout_id===checkout.checkout_id&&cart.requested_amount===checkout.total.amount;
  o.push({g:'INTEGRITY',name:'Cart Mandate valid',detail:linked?cart.cart_mandate_id+' → '+checkout.checkout_id
    :'cart signed '+cart.checkout_id+' · presented '+checkout.checkout_id,ok:linked,code:'CART_INTEGRITY'});
  return {checks:o,ok:o.every(c=>c.ok)};
}
/* ---------- THE KERNEL — pure. no LLM, no network, no clock but the one passed in ---------- */
function evaluatePolicy(claims,state,checkout,pmId,at,exception){
  const c=[],add=(n,d,ok,code,hard)=>c.push({g:'PURCHASE',name:n,detail:d,ok,code,hard:hard!==false});
  const p=checkout.product,t=checkout.total,cc=claims.constraints;
  add('Intent Mandate active',claims.mandate_id+' · '+state.status,state.status==='ACTIVE','MANDATE_REVOKED');
  add('Category',p.type+' = '+claims.scope.category,p.type===claims.scope.category,'CATEGORY_NOT_ALLOWED');
  add('Origin',p.origin+' = '+claims.scope.origin_code,p.origin===claims.scope.origin_code,'ROUTE_NOT_ALLOWED');
  add('Destination',p.destination+' = '+claims.scope.destination_code,p.destination===claims.scope.destination_code,'ROUTE_NOT_ALLOWED');
  add('Currency',t.currency,t.currency===cc.currency,'CURRENCY_MISMATCH');
  add('Payment method',pmId,pmId===claims.payment_method_id,'PAYMENT_METHOD_MISMATCH');
  add('Purchase count',state.used+' / '+cc.max_transactions,state.used<cc.max_transactions,'FREQUENCY_EXCEEDED');
  add('Not expired','until '+cc.valid_until,at<=new Date(cc.valid_until+'T23:59:59'),'MANDATE_EXPIRED');
  const cov=exception&&!exception.used&&exception.checkout_id===checkout.checkout_id&&exception.max_amount>=t.amount;
  const amtOk=t.amount<=cc.max_total_amount;
  add(money(t.amount)+' ≤ '+money(cc.max_total_amount),cov&&!amtOk?'exception '+exception.id:(amtOk?'within authority':'over by '+money(t.amount-cc.max_total_amount)),
    amtOk||cov,'AMOUNT_EXCEEDED',false);
  const failed=c.filter(x=>!x.ok);
  if(!failed.length)return{decision:'AUTHORIZED',checks:c,via:(!amtOk&&cov)?'exception':'mandate'};
  const soft=failed.every(x=>x.hard===false);
  return{decision:(soft&&claims.outside_scope_action==='ASK_HUMAN'&&state.status==='ACTIVE')?'REQUIRES_APPROVAL':'DENIED',checks:c,reason:failed[0].code};
}

/* ---------- authorization run (renders inline in the CLI) ---------- */
async function authorize(checkout,opts){
  opts=opts||{};
  if(opts.transfer){S.agent.credential.status='suspended';log('erc8004.transfer.detected',{agentId:9283,action:'KYA suspended'});}
  const cart=await makeCart(opts.swapCheckout||checkout,opts.impersonate?'attacker':'agent');
  const pmId=opts.pm||S.mandate.claims.payment_method_id;
  S.approval=null;
  log('cart_mandate.created',{cart:cart.cart_mandate_id,checkout:checkout.checkout_id});
  const idt=await verifyIdentity(S.mandate,cart,checkout,opts);
  let checks=idt.checks.slice(),decision,reason,via,exception;
  if(!idt.ok){decision='DENIED';reason=idt.checks.find(c=>!c.ok).code;
    ['Intent Mandate active','Category','Origin','Destination','Currency','Payment method','Purchase count','Not expired','Amount within authority']
      .forEach(n=>checks.push({g:'PURCHASE',name:n,detail:'not evaluated',ok:false,skip:true}));
    ['Checkout hash valid','Cart Mandate valid'].forEach(n=>checks.push({g:'INTEGRITY',name:n,detail:'not evaluated',ok:false,skip:true}));
  } else {
    exception=S.exceptions.find(e=>!e.used&&e.checkout_id===checkout.checkout_id);
    const pol=evaluatePolicy(idt.claims,S.mandate,checkout,pmId,now(),exception);
    const itg=await verifyIntegrity(cart,checkout);
    checks=checks.concat(pol.checks,itg.checks);
    if(!itg.ok){decision='DENIED';reason=itg.checks.find(c=>!c.ok).code;}
    else {decision=pol.decision;reason=pol.reason;via=pol.via;}
  }
  const blk=push('engine',{cart,checkout,checks,decision,reason,via,exception,revealed:0,amount:checkout.total.amount});
  for(let i=1;i<=checks.length;i++){await sleep(72);blk.revealed=i;render();scrollCLI();}
  await sleep(320);
  log('kernel.verdict',{decision,reason:reason||null});
  const rec={id:decision==='AUTHORIZED'?uid('YUNO_PAY_'):uid('ATT_'),ts:now(),merchant:checkout.merchant_id,
    merchantName:(MERCHANTS.find(m=>m.id===checkout.merchant_id)||{name:checkout.merchant_id}).name,
    agentId:opts.impersonate?'AG-5512':'AG-9283',agentName:opts.impersonate?'Concierge Agent':'Travel Agent',
    principal:opts.impersonate?'—':S.principal.name,mandateId:'IM_001',amount:checkout.total.amount,currency:'USD',
    decision:decision==='REQUIRES_APPROVAL'?'ESCALATED':decision,reason:reason||null,
    evidence:decision!=='DENIED',live:true};
  if(decision==='AUTHORIZED'){
    if(exception&&via==='exception')exception.used=true;
    S.mandate.used++;
    Object.assign(rec,{auth:uid('AUTH_'),flight:checkout.product.flight,via,cart:cart.cart_mandate_id,checkout:checkout.checkout_id,
      checks:checks.map(c=>({g:c.g,name:c.name,detail:c.detail,ok:c.ok})),snapshot:S.mandate.claims,
      jkt:cart.jkt,principal_id:S.principal.id,pm:S.mandate.pm});
    S.ledger.unshift(rec);log('yuno.payment',{id:rec.id,amount:rec.amount,status:'APPROVED'});
    S.lastTx=rec;await sleep(340);push('yuno',{tx:rec});
  } else if(decision==='REQUIRES_APPROVAL'){
    S.approval={checkout,cart};S.ledger.unshift(rec);log('escalation.raised',{amount:checkout.total.amount});
    await sleep(300);push('yuno',{tx:null,pending:true});
  } else {S.ledger.unshift(rec);await sleep(300);push('yuno',{tx:null});}
  return decision;
}

async function cliSend(text){
  if(!S.mandate||S.cli.busy)return;

  push('user',{text});
  S.cli.turns.push({role:'user',content:(S.cli.turns.length?'':BRIEF(S.mandate)+'\n\nUser: ')+text});
  let sm=null;try{sm=await claude.use('sample');}catch(e){}
  if(!sm){await scriptedTurn(text);S.cli.busy=false;render();return;}
  S.cli.mode='mcp';
  const tools=[
    {name:'search_offers',description:'Search the Yuno merchant network for available flight offers.',
     inputSchema:{type:'object',properties:{}},
     execute:async()=>{push('mcp',{call:'search_offers()'});await sleep(650);push('offers',{offers:OFFERS});
       return OFFERS.map(o=>({offer_id:o.id,merchant:o.merchant,flight:o.flight,price:o.price,currency:'USD',departure:o.dep,description:o.desc}));}},
    {name:'request_checkout',description:'Ask the merchant to create an official checkout for an offer. The merchant is the source of truth for price.',
     inputSchema:{type:'object',properties:{offer_id:{type:'string'}},required:['offer_id']},
     execute:async({offer_id})=>{const o=OFFERS.find(x=>x.id===offer_id);if(!o)return{error:'unknown offer_id'};
       push('mcp',{call:'request_checkout("'+offer_id+'")'});await sleep(550);
       const c=await makeCheckout(o);S.cli.checkout=c;
       push('mcp',{call:'← '+c.checkout_id+' · '+money(c.total.amount)+' · merchant-priced',res:true});
       return{checkout_id:c.checkout_id,merchant_id:c.merchant_id,total:c.total,product:c.product};}},
    {name:'request_purchase',description:'Submit a purchase for a checkout. An independent authorization engine returns AUTHORIZED, DENIED or REQUIRES_APPROVAL. This never moves money by itself.',
     inputSchema:{type:'object',properties:{checkout_id:{type:'string'}},required:['checkout_id']},
     execute:async({checkout_id})=>{const c=S.cli.checkout;
       if(!c||c.checkout_id!==checkout_id)return{error:'no such checkout — call request_checkout first'};
       push('mcp',{call:'request_purchase("IM_001","'+checkout_id+'")'});
       const d=await authorize(c,{});
       return{decision:d,authorized_ceiling:S.mandate.claims.constraints.max_total_amount,requested:c.total.amount};}}
  ];
  try{
    const r=await Promise.race([sm(S.cli.turns,{tools,modelTier:'default',
      onText:({text})=>{S.cli.stream=text;render();scrollCLI();}}),
      new Promise((_,j)=>setTimeout(()=>j(0),45000))]);
    S.cli.stream=null;
    if(r&&r.text){push('agent',{text:r.text});S.cli.turns.push({role:'assistant',content:r.text});}
  }catch(e){S.cli.stream=null;push('agent',{text:'(the model did not respond — continuing with the deterministic agent)',warn:true});await scriptedTurn(text);}
  S.cli.busy=false;render();scrollCLI();
}

/* deterministic stand-in — same beats, no network. the demo never depends on a model */
async function scriptedTurn(text){
  S.cli.mode='scripted';
  const s=(text||'').toLowerCase();
  let pick=OFFERS[0];
  if(/c[oó]modo|comfort|premium|189|caro|expensive|travelmax/.test(s))pick=OFFERS[2];
  else if(/300|gocheap|special|500/.test(s))pick=OFFERS[3];
  else if(/145|flynow|ma[ñn]ana/.test(s))pick=OFFERS[1];
  push('agent',{text:'Understood. I am searching the merchant network for options.'});await sleep(500);
  push('mcp',{call:'search_offers()'});await sleep(600);push('offers',{offers:OFFERS});await sleep(500);
  push('agent',{text:pick===OFFERS[0]
    ?'VuelaYa at $132 and FlyNow at $145 both fit. VuelaYa is the cheapest, so I will try that one.'
    :'I will try '+pick.merchant+' at $'+pick.price+'.'});
  await sleep(700);
  push('mcp',{call:'request_checkout("'+pick.id+'")'});await sleep(550);
  const c=await makeCheckout(pick);S.cli.checkout=c;
  push('mcp',{call:'← '+c.checkout_id+' · '+money(c.total.amount)+' · merchant-priced',res:true});await sleep(500);
  push('mcp',{call:'request_purchase("IM_001","'+c.checkout_id+'")'});
  const d=await authorize(c,{});
  await sleep(300);
  push('agent',{text:d==='AUTHORIZED'?'Purchase completed for '+money(c.total.amount)+'.'
    :d==='REQUIRES_APPROVAL'?'I cannot complete this on my own: it exceeds your '+money(S.mandate.claims.constraints.max_total_amount)+' authority. I requested your approval.'
    :'I cannot complete this purchase: it exceeds your '+money(S.mandate.claims.constraints.max_total_amount)+' authority.'});
}

function blockView(b){
  const t=`<span class="mono" style="font-size:10.5px;color:var(--mut2)">${hhmmss(b.t)}</span>`;
  if(b.kind==='user')return `<div class="blk user"><div class="lane">${b.attack?'ATTACK CONSOLE':b.human?'HUMAN':'USER'}</div>
    <div class="body"><p class="utext">${b.attack||b.human?'':'&gt; '}${esc(b.text)}</p></div></div>`;

  if(b.kind==='mcp')return `<div class="blk mcp"><div class="lane">MCP</div>
    <div class="body"><p class="mtext ${b.res?'res':''}">${b.res?'':'→ '}${esc(b.call)}</p></div></div>`;
  if(b.kind==='offers'){const cap=S.mandate?S.mandate.claims.constraints.max_total_amount:0;
    return `<div class="blk mcp"><div class="lane">MCP</div><div class="body">
      <p class="mtext res">← ${b.offers.length} offers</p>
      <div style="margin-top:8px">${b.offers.map(o=>`<div class="orow ${o.poison?'poison':o.price<=cap?'':'over'}">
        <span class="mono" style="font-size:11.5px;color:var(--mut2)">${o.id}</span>

        <span class="mono" style="font-weight:600">${money(o.price)}</span>
        <span style="text-align:right">${o.price<=cap?'<span class="pill ok">WITHIN</span>':'<span class="pill bad">OVER LIMIT</span>'}</span></div>`).join('')}</div>
      ${b.offers.some(o=>o.poison)?`<p style="margin:9px 0 0;font-size:11.5px;color:var(--bad);line-height:1.5">That last listing is an <b>indirect prompt injection</b> — merchant data, not user input. The model may well obey it.</p>`:''}
    </div></div>`;}
  if(b.kind==='engine'){
    let rows='',lastG=null;
    b.checks.forEach((c,i)=>{if(c.g!==lastG){rows+=`<div class="gh">${c.g}</div>`;lastG=c.g;}
      rows+=`<div class="chk ${i<b.revealed?'in':''} ${c.skip?'skip':(c.ok?'pass':'fail')}">
        <span class="n">${c.name}</span><span class="d">${esc(c.detail)}</span>
        <span class="r">${c.skip?'—':(c.ok?ico.ok:ico.bad)}</span></div>`;});
    const done=b.revealed>=b.checks.length;
    const hard=b.checks.some(c=>!c.ok&&!c.skip&&HARDFAIL.includes(c.code));
    let vd='';
    if(done){const cls=b.decision==='AUTHORIZED'?'ok':b.decision==='REQUIRES_APPROVAL'?'esc':'bad';
      const ttl=b.decision==='AUTHORIZED'?'AUTHORIZED':b.decision==='REQUIRES_APPROVAL'?'REQUIRES APPROVAL':(hard?'IDENTITY REJECTED':'BLOCKED');
      vd=`<div class="edict ${cls}"><span class="h">${ttl}</span>
        <span class="s">${b.decision==='AUTHORIZED'?(b.checks.length+' / '+b.checks.length+' conditions'+(b.via==='exception'?' · single-use exception':'')):esc(REASONS[b.reason]||'')}</span>
        ${b.decision!=='AUTHORIZED'?`<span class="nums">requested <b>${money(b.amount)}</b> · authority <b>${money(S.mandate.claims.constraints.max_total_amount)}</b></span>`:''}</div>
      ${b.reason==='MANDATE_REVOKED'&&S.mandate.revokedAt?`<p class="mtext" style="margin-top:8px;color:var(--bad)">mandate revoked at ${hhmmss(S.mandate.revokedAt)} · purchase attempted at ${hhmmss(b.t)}</p>`:''}`;}
    return `<div class="blk engine"><div class="lane">AUTHORIZATION<br>ENGINE</div><div class="body">
      <p class="mtext res" style="margin-bottom:8px">${b.checkout.checkout_id} · ${b.cart.cart_mandate_id} · hash ${esc(b.cart.checkout_hash)}</p>
      <div class="card" style="overflow:hidden">${rows}</div>${vd}</div></div>`;}
  if(b.kind==='yuno'){
    if(b.tx)return `<div class="blk yuno"><div class="lane">YUNO</div><div class="body">
      <div class="ypay"><span class="ok">${ico.ok} PAYMENT APPROVED</span>
        <span class="mono" style="font-size:19px;font-weight:600">${money(b.tx.amount)}</span>

        <button class="btn sm" data-act="nav" data-v="txn" style="margin-left:auto">View proof</button></div></div></div>`;
    return `<div class="blk yuno"><div class="lane">YUNO</div><div class="body">
      <div class="ypay bad"><span class="mono" style="font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--bad)">NOT CALLED</span>
      <span style="font-size:12.5px;color:var(--mut)">No payment request left the authority layer${b.pending?' — waiting on a human':''}.</span></div></div></div>`;}
  return '';
}

      <div><h2>${esc(a.name)}</h2><p class="mono" style="margin:2px 0 0;font-size:11.5px;color:var(--mut2)">${a.uuid}</p></div>
      <span style="margin-left:auto">${a.credential.status==='active'?'<span class="pill ok">'+ico.ok+' KYA ACTIVE</span>':'<span class="pill bad">CREDENTIAL SUSPENDED</span>'}</span></div>
    <div class="grid2">
      <div><p class="lbl">Registry entry</p>
        <div class="row"><span class="k">chain</span><span class="v mono">Base Sepolia · 84532</span></div>
        <div class="row"><span class="k">agent_id</span><span class="v mono">${a.agentId}</span></div>
        <div class="row"><span class="k">owner</span><span class="v">${esc(S.principal.name)}</span></div>

      <div><p class="lbl">Technical details</p>
        <div class="row"><span class="k">Curve</span><span class="v mono">P-256 · ES256</span></div>
        <div class="row"><span class="k">cnf.jkt</span><span class="v mono" style="font-size:10.5px">${esc(a.jkt.slice(0,20))}…</span></div>
        <div class="row"><span class="k">agentURI</span><span class="v mono" style="font-size:10.5px">kya.y2a.dev/…</span></div>
        <div class="row"><span class="k">Private key</span><span class="v">never leaves the device</span></div></div></div>
    ${a.transferred||a.credential.status!=='active'?`<div style="margin-top:18px;padding:14px 16px;border-radius:8px;background:var(--bad-s);border:1px solid var(--bad)">
      <p style="margin:0;font-size:13.5px;line-height:1.55;color:var(--ink2)"><b>Transfer detected on-chain.</b> The identity NFT changed owner, so the KYA binding suspended automatically — and stays suspended until the new owner is an active verified Principal <b>and</b> explicitly approves the binding.</p></div>`:''}
    <div style="margin-top:18px;padding:14px 16px;border-radius:8px;background:var(--surf)">
      <p style="margin:0;font-size:12.5px;line-height:1.55;color:var(--ink2)"><b>Identity Registry · consumed, not deployed.</b> <span class="mono">register()</span> mints to <span class="mono">msg.sender</span>, so ownership resolves to the person's smart account — never to a platform relayer.</p></div></div>`;

function vSnippets(){
  const endpoint='https://mcp.y2a.dev/mcp';
  const snippets=[
    ['Claude','@anthropic-ai/sdk','const client = new Anthropic({ apiKey: process.env.ANTHROPIC_API_KEY });\n\nconst response = await client.beta.messages.create({\n  model: "claude-sonnet-4-5",\n  max_tokens: 1024,\n  mcp_servers: [{\n    name: "y2a",\n    url: "'+endpoint+'",\n    authorization_token: process.env.Y2A_API_KEY\n  }],\n  messages: [{ role: "user", content: "Create a payment mandate" }]\n});'],
    ['Gemini','@google/genai','const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });\n\nconst response = await ai.models.generateContent({\n  model: "gemini-2.5-pro",\n  contents: "Create a payment mandate",\n  config: {\n    tools: [{\n      mcpServer: { url: "'+endpoint+'",\n        headers: { Authorization: "Bearer " + process.env.Y2A_API_KEY } }\n    }]\n  }\n});'],
    ['ChatGPT','OpenAI Responses API','const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });\n\nconst response = await client.responses.create({\n  model: "gpt-5",\n  input: "Create a payment mandate",\n  tools: [{\n    type: "mcp",\n    server_label: "y2a",\n    server_url: "'+endpoint+'",\n    headers: { Authorization: "Bearer " + process.env.Y2A_API_KEY }\n  }]\n});']
  ];
  return `<div class="hd"><div><h1>MCP Snippets</h1><p class="sub">Connect your model to Y2A through Model Context Protocol.</p></div></div>
    <div class="card pad" style="margin-bottom:16px;background:var(--surf2)"><p class="lbl">Endpoint</p><p class="mono" style="margin:0;font-size:13px">${endpoint}</p><p style="margin:8px 0 0;color:var(--mut);font-size:13px">Use your Y2A key as a Bearer token to authenticate MCP calls.</p></div>
    <div class="grid3">${snippets.map(([name,library,code])=>`<section class="card" style="overflow:hidden"><div class="pad" style="padding-bottom:12px"><h2>${name}</h2><p class="sub mono" style="font-size:11px">${library}</p></div><pre style="margin:0;padding:16px;overflow:auto;background:var(--ink);color:#fff;font:11px/1.6 'JetBrains Mono',monospace;min-height:292px"><code>${esc(code)}</code></pre></section>`).join('')}</div>`;
}
function table(rows,showM){
  if(!rows.length)return '<div class="card pad" style="text-align:center;color:var(--mut)">Nothing here yet.</div>';
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>Time</th>${showM?'<th>Merchant</th>':''}<th>Agent</th><th>Principal</th><th>Amount</th><th>Decision</th><th>Reason</th><th>Evidence</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.live?'live':''}" data-act="detail" data-id="${r.id}">
    <td class="mono" style="color:var(--mut)">${hhmm(r.ts)}${r.live?' <span class="pill yel" style="margin-left:5px">LIVE</span>':''}</td>
    ${showM?`<td>${r.merchantName}</td>`:''}
    <td><span class="mono" style="font-size:12px">${r.agentId}</span></td>
    <td style="color:var(--mut)">${esc(r.principal)}</td><td class="mono" style="font-weight:600">${money(r.amount)}</td>
    <td>${pf(r.decision)}</td><td>${r.reason?`<span class="rsn">${r.reason}</span>`:'<span style="color:var(--mut2)">—</span>'}</td>
    <td>${r.evidence?ico.ok:'<span style="color:var(--mut2)">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}
function vDetail(){
  const tx=L().find(r=>r.id===S.detail);if(!tx){S.detail=null;return vActivity();}
  return `<div class="hd"><div><p class="lbl" style="margin-bottom:6px">Record</p><h1>${tx.id}</h1>
    <p class="sub mono" style="font-size:12.5px">${tx.merchantName} · ${hhmmss(tx.ts)} · ${money(tx.amount)}</p></div>
    <span style="margin-left:auto">${pf(tx.decision)}</span></div>
  <button class="btn sm" data-act="back" style="margin-bottom:18px">← Back</button>
  ${tx.checks?`<div class="card"><div class="pad" style="padding-bottom:8px"><p class="lbl">Checks at authorization time</p></div>
    <div style="padding:0 22px 18px">${tx.checks.map(c=>`<div class="row"><span class="k">${c.name}</span>
      <span class="v mono" style="font-size:11px;color:var(--mut);font-weight:400">${esc(c.detail)}</span><span>${ico.ok}</span></div>`).join('')}</div></div>`
  :`<div class="card pad" style="border-color:var(--bad)">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:14px">${ico.warn}<b style="font-size:15px">${tx.reason||'Blocked'}</b></div>
    <p style="margin:0 0 16px;font-size:14px;line-height:1.55;color:var(--ink2)">${esc(REASONS[tx.reason]||'Refused by the kernel.')}</p>
    <div class="row"><span class="k">Presenting agent</span><span class="v mono">${tx.agentId}</span></div>
    <div class="row"><span class="k">Amount requested</span><span class="v mono">${money(tx.amount)}</span></div>
    <div class="row"><span class="k">Payment request sent</span><span class="v" style="color:var(--bad);font-weight:600">NO</span></div>
    <div style="margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--surf)">
      <p style="margin:0;font-size:13px;line-height:1.55;color:var(--ink2)">Nothing reached a payment processor. No charge to reverse, no chargeback to fight, no cost to the merchant.</p></div></div>`}`;
}

function vCeremony(){const c=S.cer;
  return `<div class="cer"><div class="cerbox">
    <div style="padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px">${logo}
      <div><p style="margin:0;font-size:16px;font-weight:600;letter-spacing:-.018em">Identity &amp; agent enrollment</p>
      <p style="margin:2px 0 0;font-size:12.5px;color:var(--mut)">Each UI action, and the backend step behind it</p></div>
      <span class="mono" style="margin-left:auto;font-size:11.5px;color:var(--mut2)">${Math.min(c.i+1,CER.length)}/${CER.length}</span></div>
    ${CER.map((s,i)=>`<div class="step ${i<c.i?'done':i===c.i?(c.waiting&&i===6?'act wait':'act'):''}">
      <span class="mk">${i<c.i?ico.ok:(i===c.i&&!c.waiting?'<span class="spin"></span>':i+1)}</span>
      <span><span class="ui">${s[0]}</span><span class="be">${esc(s[1])}</span>
      ${c.waiting&&i===6?`<div style="margin-top:12px;padding:14px 16px;border-radius:8px;background:#fff;border:1px solid var(--line)">
        <p class="lbl" style="margin-bottom:6px">Agent key fingerprint</p>
        <p class="mono" style="margin:0 0 12px;font-size:13px;word-break:break-all">${esc(S.keys.agent.jkt)}</p>
        <button class="btn yel" data-act="approvefp">Authorize this agent</button></div>`:''}</span></div>`).join('')}
    ${c.i>=CER.length?`<div style="padding:20px 24px;background:var(--ok-s);text-align:center">
      <p style="margin:0;font-size:15px;font-weight:700;color:var(--ok);letter-spacing:.04em">AGENT READY · KYA CREDENTIAL ACTIVE</p></div>`:''}
    <div style="padding:14px 24px;border-top:1px solid var(--line);text-align:right"><button class="btn sm" data-act="closecer">Close</button></div>
  </div></div>`;}

function vDrawer(){

    <div style="display:flex;align-items:center;margin-bottom:14px"><h2 style="margin:0">Try to break it</h2>
      <button class="btn sm" data-act="drawer" style="margin-left:auto">Close</button></div>

    ${!m?'<p style="font-size:13px;color:var(--bad)">Authorize a mandate first.</p>':`

    ${a('Prompt-injected offer','GoCheap $300 · the poisoned listing','poison')}
    ${a('Swap the card','a payment method not in the mandate','pm')}
    <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--line)">
      <div class="row"><span class="k">Intent Mandate</span><span class="v">${m.status}</span></div>
      <div class="row"><span class="k">KYA credential</span><span class="v">${S.agent.credential.status}</span></div>
      <div class="row"><span class="k">Purchases</span><span class="v mono">${m.used}/${m.claims.constraints.max_transactions}</span></div>
      <button class="btn red big" data-act="revoke" style="margin-top:10px" ${m.status!=='ACTIVE'?'disabled':''}>REVOKE MANDATE</button>
      <p style="margin:10px 0 0;font-size:11.5px;color:var(--mut2);line-height:1.45">Then go back and tell the agent to find another flight.</p></div>`}

/* ---------- sign-in (sandbox) ---------- */
const SIGN=[['Verifying passkey','auth.passkey.verify() → session'],
 ['Checking Principal','GET /principal → kyc_status'],
 ['Didit identity check','adapter.normalize(webhook) → VERIFIED']];
async function signIn(){
  if(S.signing)return;
  for(let i=1;i<=SIGN.length;i++){S.signing=i;render();await sleep(560);}
  S.authed=true;S.signing=0;S.tour=0;S.view='overview';log('session.opened',{principal:S.principal.id,provider:'Didit'});render();
}
function vLogin(){
  const st=i=>S.signing>i+1?'done':S.signing===i+1?'act':'';
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px;background:var(--surf2)">
   <div style="width:100%;max-width:412px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:26px">${logo}
      <b style="font-size:12px;font-weight:700;letter-spacing:.13em;line-height:1.25">Y2A</b>
      <span class="pill mut" style="margin-left:auto">SANDBOX</span></div>
    <div class="card" style="overflow:hidden">
      <div class="pad" style="padding:26px 26px 22px">
        <h1 style="font-size:25px;letter-spacing:-.028em;margin:0 0 6px">Sign in</h1>
        <p style="margin:0 0 22px;font-size:14px;color:var(--mut);line-height:1.5">The authority layer for agentic commerce. Identity is verified once, for the person.</p>
        <div class="pmcard" style="padding:14px 16px;margin-bottom:16px;gap:12px">
          <span style="width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--yel);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none">J</span>
          <div><p style="margin:0;font-size:14.5px;font-weight:600">Joaquín</p>
            <p class="mono" style="margin:1px 0 0;font-size:11.5px;color:var(--mut2)">PRN_001 · Didit verified</p></div>
          <span style="margin-left:auto">${ico.ok}</span></div>
        <button class="btn yel big" data-act="signin" ${S.signing?'disabled':''}>
          ${S.signing?'<span class="spin"></span> &nbsp;Verifying…':'Continue with Passkey'}</button>
        <p style="margin:11px 0 0;text-align:center;font-size:12px;color:var(--mut2)">or press <span class="mono">Enter</span></p>
      </div>
      ${S.signing?`<div style="border-top:1px solid var(--line2)">
        ${SIGN.map((s,i)=>`<div class="step ${st(i)}" style="padding:11px 26px">
          <span class="mk">${S.signing>i+1?ico.ok:(S.signing===i+1?'<span class="spin"></span>':i+1)}</span>
          <span><span class="ui" style="font-size:13.5px">${s[0]}</span><span class="be">${esc(s[1])}</span></span></div>`).join('')}
      </div>`:''}
    </div>
    <p style="margin:18px 0 0;text-align:center;font-size:11.5px;color:var(--mut2);line-height:1.55">
      Demo environment. No real credentials are collected and no real payment is processed.<br>
      KYC is simulated; a verified Principal is pre-provisioned.</p>
   </div></div>`;
}

/* ---------- shell ---------- */
const NAV=[['overview','Overview'],['agents','My Agent'],['mandates','Mandates'],['cards','Cards'],['activity','Activity'],['snippets','MCP Snippets']];
const TOUR=[
  ['overview','Overview','Get a quick snapshot of your verified identity, connected agent, payment method, and active mandate.'],
  ['agents','My Agent','Review the agent that can act for you, its credential status, identity binding, and cryptographic key details.'],
  ['mandates','Mandates','Create, inspect, and revoke the rules that define exactly what your agent is allowed to purchase.'],
  ['cards','Cards','Manage payment methods that can be bound to a mandate. Your agent never receives raw card details.'],
  ['activity','Activity','Review every purchase attempt made by your agent, including approved, blocked, and escalated decisions.'],
  ['snippets','MCP Snippets','Copy ready-to-adapt examples for connecting Claude, Gemini, or ChatGPT to Y2A through MCP.']
];
function vTour(){
  const [,title,description]=TOUR[S.tour];
  return `<div class="tourshade" aria-hidden="true"></div><section class="tourcard" role="dialog" aria-modal="true" aria-label="Guided tour">
    <div class="tourmeta">GUIDED TOUR · ${S.tour+1} / ${TOUR.length}</div><h2>${title}</h2><p>${description}</p>
    <div class="touractions"><button class="skip" data-act="tourskip">Skip tour</button>${S.tour>0?'<button class="btn sm" data-act="tourprev">Back</button>':''}<button class="btn dark sm" data-act="tournext">${S.tour===TOUR.length-1?'Finish':'Next'}</button></div>
  </section>`;
}
function render(){
  const root=document.getElementById('root');
  if(!S.booted){root.innerHTML='<div style="height:100vh;display:flex;align-items:center;justify-content:center;color:var(--mut)"><span class="spin"></span>&nbsp;&nbsp;starting…</div>';return;}
  if(!S.authed){root.innerHTML=vLogin();return;}
  let body;
  if(S.detail)body=vDetail();
  else body=({overview:vOverview,agents:vAgents,mandates:vMandates,cards:vCards,activity:vActivity,
    snippets:vSnippets,txn:vTxn}[S.view]||vOverview)();
  const who=[S.principal.name,'Verified principal'];
  root.innerHTML=`<div class="app">
    <aside class="side"><div class="brand">${logo}<b>Y2A</b></div>
      <nav class="nav">${NAV.map(([k,l])=>`<button data-nav="${k}" class="${S.view===k&&!S.detail?'on':''}${S.tour!==null&&TOUR[S.tour][0]===k?' tour-target':''}">${l}${k==='cards'?`<span class="ct">${S.cards.length}</span>`:''}</button>`).join('')}</nav>
      <div class="who"><p class="nm">${esc(who[0])}</p><p class="rl">${who[1]}</p></div></aside>
    <div><header class="top">
      <span class="pill yel">${esc(S.principal.name.toUpperCase())}</span>
      <span class="live"><span class="blink"></span>LIVE</span>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="mono" style="font-size:11px;color:var(--mut2)">P-256 · ES256</span>
        <button class="btn sm" data-act="reset">Reset</button>
        <button class="btn sm" data-act="signout">Sign out</button></span></header>
      <main>${body}</main></div>
  </div>${S.drawer?vDrawer():''}${S.cer?vCeremony():''}${S.tour!==null?vTour():''}`;
  document.querySelectorAll('[data-tip]').forEach(el=>{const tip=document.getElementById('tip');
    el.addEventListener('mousemove',e=>{tip.textContent=el.dataset.tip;tip.style.opacity='1';
      tip.style.left=Math.min(innerWidth-tip.offsetWidth-12,e.clientX+14)+'px';tip.style.top=(e.clientY-38)+'px';});
    el.addEventListener('mouseleave',()=>{tip.style.opacity='0';});});
}

document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-nav]');if(nav){S.view=nav.dataset.nav;S.detail=null;render();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='tournext'){if(S.tour===TOUR.length-1)S.tour=null;else{S.tour++;S.view=TOUR[S.tour][0];S.detail=null;}render();}
  else if(a==='tourprev'){if(S.tour>0){S.tour--;S.view=TOUR[S.tour][0];S.detail=null;}render();}
  else if(a==='tourskip'){S.tour=null;render();}
  else if(a==='nav'){S.view=el.dataset.v;S.detail=null;render();}
  else if(a==='filter'){S.filter=el.dataset.f;render();}
  else if(a==='detail'){S.detail=el.dataset.id;render();}
  else if(a==='back'){S.detail=null;render();}
  else if(a==='drawer'){S.drawer=!S.drawer;render();}
  else if(a==='signin')signIn();
  else if(a==='ceremony')ceremony();
  else if(a==='closecer'){S.cer=null;render();}
  else if(a==='approvefp'){log('agent.fingerprint.approved',{jkt:S.keys.agent.jkt.slice(0,16)});if(S.cer&&S.cer.resolve)S.cer.resolve();}
  else if(a==='addcard'){S.addingCard=true;render();}
  else if(a==='cancelcard'){S.addingCard=false;render();}
  else if(a==='savecard'){const raw=(document.getElementById('cnum')||{}).value||S.cardNum;
    S.cards.unshift({id:uid('PM_'),customer:'CUS_001',brand:'VISA',last4:raw.replace(/\D/g,'').slice(-4)||'4242',
      token:'tok_'+uid(''),exp:'09/29',added:now(),fresh:true});
    log('yuno.payment_method.enrolled',{pm:S.cards[0].id,pan_retained:false});S.addingCard=false;render();}
  else if(a==='preset'){S.cli.input=el.dataset.t;render();const i=document.getElementById('cli-in');if(i)i.focus();}
  else if(a==='compile'){const t=document.getElementById('nl');S.nlText=t?t.value:S.nlText;compile(S.nlText);}
  else if(a==='authorize')authorizeMandate();
  else if(a==='authorizeproposal')authorizeProposal();
  else if(a==='writeown'){S.writeOwn=true;render();}
  else if(a==='useproposal'){S.writeOwn=false;render();}
  else if(a==='revoke')revoke();
  else if(a==='send'){const t=document.getElementById('cli-in');const v=(t?t.value:S.cli.input).trim();if(v)cliSend(v);}
  else if(a==='approveonce')approveOnce();
  else if(a==='rejectesc')rejectApproval();
  else if(a==='atk')attack(el.dataset.k);
  else if(a==='signout'){S.authed=false;render();}
  else if(a==='reset'){S=seed();_s=20260829;boot();}
});
document.addEventListener('input',e=>{if(e.target.id==='cli-in')S.cli.input=e.target.value;});
document.addEventListener('keydown',e=>{
  if(S.tour!==null&&e.key==='Escape'){S.tour=null;render();return;}
  if(!S.authed&&S.booted&&e.key==='Enter'){e.preventDefault();signIn();return;}
  if(e.target.id==='cli-in'&&e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();const v=e.target.value.trim();if(v)cliSend(v);}});
boot();
</script>
</body>
